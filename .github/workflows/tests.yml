name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    # Pinned, not -latest: ubuntu-latest moved to 26.04 and the pinned Playwright
    # cannot install a browser there, which is the same class of drift the
    # constraints file exists to stop. Move both together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt
      - name: Install the browser
        run: python -m playwright install --with-deps chromium
      - name: Run the smoke suite
        run: python -m pytest
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: test-results/
          if-no-files-found: ignore

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # The page's JavaScript lives in assets/app.js now, so script-src no longer
    # needs 'unsafe-inline'. style-src still does: the markup carries style
    # attributes and app.js writes element styles. The Python host sends the
    # same policy, so a local run and the deploy enforce one policy.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://learnwithclay.ai; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

# the translation table is large and changes only when a language does, so let
# repeat visitors reuse it (revalidate inside the hour, so a deploy is not stale)
[[headers]]
  for = "/i18n.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# the split assets under assets/ get the same treatment
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
